projectName: Robot Framework Playwright Load Testing Sample
loadTestName: robot-playwright-sample
framework: playwright-robot
files:
  dependencies:
    - requirements.txt
  testConfigs:
    - tests/
thresholds: []
headless: true
vus: 2
duration: 1m 50s
regions:
  - loadzone: eu-central-1
    percent: 100
loadProfile: ramping
loadProfileStages:
  - duration: 10s
    startVUs: 0
    targetVUs: 2
    type: ramp-up
  - duration: 1m 30s
    startVUs: 2
    targetVUs: 2
    type: hold
  - duration: 10s
    startVUs: 2
    targetVUs: 0
    type: ramp-down
