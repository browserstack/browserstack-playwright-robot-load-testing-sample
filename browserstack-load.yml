projectName: Robot Framework Playwright Load Testing Sample
loadTestName: robot-playwright-sample
framework: playwright-robot
files:
  dependencies:
    - requirements.txt
  testConfigs:
    - tests/
# Pass/fail criteria for the run. Tune these to your application's SLA.
thresholds:
  - metric: error-percentage
    condition: "<"
    threshold: 5
    unit: "%"
    type: blu
    requestType: entireTestRun
    failOnBreach: false
  - metric: p95-response-time
    condition: "<"
    threshold: 10000
    unit: ms
    type: blu
    requestType: entireTestRun
    failOnBreach: false
headless: true
vus: 2
duration: 1m 50s
regions:
  - loadzone: eu-central-1
    percent: 100
loadProfile: ramping
loadProfileStages:
  - duration: 10s
    startVUs: 0
    targetVUs: 2
    type: ramp-up
  - duration: 1m 30s
    startVUs: 2
    targetVUs: 2
    type: hold
  - duration: 10s
    startVUs: 2
    targetVUs: 0
    type: ramp-down
